name: formulacheck
description: Verify formulas (symbolic, numeric, Monte Carlo) and citations in Markdown math notes.
author: formulacheck contributors
branding:
  icon: check-square
  color: green

inputs:
  paths:
    description: Files or folders to check (space separated).
    required: false
    default: "."
  args:
    description: Extra options, e.g. "--strict" or "--offline --no-citations".
    required: false
    default: ""
  python-version:
    description: Python version used to run formulacheck.
    required: false
    default: "3.12"

runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}
    - name: Install formulacheck
      shell: bash
      env:
        FC_ACTION_PATH: ${{ github.action_path }}
      run: python -m pip install --quiet "$FC_ACTION_PATH"
    - name: Run formulacheck
      shell: bash
      env:
        FC_PATHS: ${{ inputs.paths }}
        FC_ARGS: ${{ inputs.args }}
      # Word splitting of FC_PATHS and FC_ARGS is intended (several paths and options).
      run: formulacheck $FC_PATHS $FC_ARGS
